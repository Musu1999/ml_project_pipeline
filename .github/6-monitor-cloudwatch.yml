name: 6-Monitor-Pipeline-CloudWatch

on:
  workflow_dispatch:                    # run manually anytime
  workflow_run:
    workflows: ["4. Model Deployment"]  # auto-run after deploy
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'              # every 6 hours automatically

jobs:
  cloudwatch-monitor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run CloudWatch monitoring
        env:
          S3_BUCKET:     ${{ vars.S3_BUCKET }}
          ENDPOINT_NAME: ${{ vars.ENDPOINT_NAME }}
          PROJECT_NAME:  ${{ vars.PROJECT_NAME }}
          AWS_REGION:    ${{ vars.AWS_REGION }}
          ALERT_EMAIL:   ${{ secrets.ALERT_EMAIL }}
        run: |
          python src/monitoring/cloudwatch_monitor.py

      - name: Write job summary
        if: always()
        run: |
          echo "## CloudWatch Monitoring Run ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard:** AttritionIQ-Monitor" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** AttritionIQ" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoint:** ${{ vars.ENDPOINT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View in AWS Console:**" >> $GITHUB_STEP_SUMMARY
          echo "CloudWatch → Dashboards → AttritionIQ-Monitor" >> $GITHUB_STEP_SUMMARY
