name: CI — Continuous Integration

# ─────────────────────────────────────────────────────────────────
# TRIGGER : Every push to main + every pull request
# PURPOSE : Catch bugs BEFORE any AWS / cloud is touched
# STAGES  : Lint → Unit Tests
# NO AWS  : This workflow never calls AWS at all
# ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install lint tools
        run: pip install flake8 black
      - name: Black format check
        run: |
          black --check --diff src/ tests/ \
            || echo "::warning::Run 'black src/ tests/' locally to fix"
      - name: Flake8 critical errors only
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --select=E9,F63,F7,F82 \
            --show-source

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install pytest \
            boto3 pandas numpy scikit-learn xgboost joblib
      - name: Run all unit tests
        run: |
          pytest tests/test_pipeline.py -v --tb=short
      - name: Write CI summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "> Safe to merge — no AWS was touched" >> $GITHUB_STEP_SUMMARY
