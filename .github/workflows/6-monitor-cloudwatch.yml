name: 6-Monitor-Pipeline-CloudWatch

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["4. Model Deployment"]
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours

jobs:
  cloudwatch-monitor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run CloudWatch monitoring
        env:
          S3_BUCKET:     ${{ vars.S3_BUCKET }}
          ENDPOINT_NAME: ${{ vars.ENDPOINT_NAME }}
          PROJECT_NAME:  ${{ vars.PROJECT_NAME }}
          AWS_REGION:    ${{ vars.AWS_REGION }}
        run: |
          python src/monitoring/cloudwatch_monitor.py

      # This step always runs — writes result to the Actions summary page
      - name: Write summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ CloudWatch Monitoring — All Clear" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ CloudWatch Monitoring — Alerts Active" >> $GITHUB_STEP_SUMMARY
            echo "Check CloudWatch console for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | AttritionIQ-Monitor |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | AttritionIQ |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | ${{ vars.ENDPOINT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ vars.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
